name: Deploy production

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ROOT: /opt/nedra

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check backend imports
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/db
          CORS_ORIGINS: "[]"
        run: |
          pip install -q -r requirements.txt
          python -c "from app.main import app; print('backend imports ok')"

      - name: Configure SSH
        run: |
          for variable in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::GitHub secret $variable is not configured"
              exit 1
            fi
          done

          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"

      - name: Upload sources
        run: |
          ssh_cmd="ssh -p $DEPLOY_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes"

          $ssh_cmd "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$APP_ROOT'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.deploy/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            -e "$ssh_cmd" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$APP_ROOT/"

      - name: Build and restart stack
        run: |
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -se -- '$APP_ROOT'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          app_root="$1"
          cd "$app_root"

          if [ ! -f .env ]; then
            echo "::error::$app_root/.env отсутствует. Создайте его из .env.example."
            exit 1
          fi

          docker compose build
          docker compose up -d --remove-orphans

          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Health check не прошёл. Логи backend:"
            docker compose logs --tail 80 backend
            echo "Логи nginx:"
            docker compose logs --tail 30 nginx
            exit 1
          fi

          docker compose ps
          docker image prune -f
          REMOTE_SCRIPT
